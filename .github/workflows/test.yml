name: Automated tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  e2e-tests:
    name: End-to-end tests (Cypress)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start app and run Cypress tests
        run: |
          npm start > /tmp/todo-app.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/health > /dev/null; then
              npx cypress run
              exit $?
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/todo-app.log
              exit 1
            fi

            sleep 2
          done

          cat /tmp/todo-app.log
          echo "App did not become ready at http://127.0.0.1:5173/health" >&2
          exit 1
